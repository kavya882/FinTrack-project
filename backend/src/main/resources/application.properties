spring.application.name=fintrack-backend
server.port=${PORT:8080}

# DATABASE (H2 Local Fallback OR Aiven MySQL in Cloud)
spring.datasource.url=${DB_URL:jdbc:h2:mem:fintrackdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:password}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=fintracksecuresecretkeyfintracksecuresecretkey12345
app.jwt.expiration=86400000